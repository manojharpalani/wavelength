<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavelength</title>
<meta name="description" content="Wavelength: build a shareable &quot;how I work&quot; guide in five minutes, so teammates stop guessing and collaboration gets smoother.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Work Sans', ui-sans-serif, system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    --accent: #c2603f;
    --bg: oklch(97.3% 0.01 80);
    --surface: oklch(99% 0.004 80);
    --ink: oklch(23% 0.02 60);
    --muted: oklch(48% 0.02 60);
    --placeholder: oklch(66% 0.012 60);
    --line: oklch(90% 0.01 70);
    --line-strong: oklch(79% 0.015 65);
  }
  .app { display: flex; min-height: 100vh; }
  a { color: var(--accent); }
  a:hover { color: color-mix(in oklch, var(--accent) 70%, black); }

  .sidebar {
    width: 272px; flex-shrink: 0; padding: 44px 24px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 3px;
  }
  .sidebar-brand { display: flex; align-items: center; gap: 8px; font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 600; margin: 0 0 8px; color: var(--ink); }
  .sidebar-tagline { font-size: 13px; color: var(--muted); line-height: 1.55; margin: 0 0 30px; }
  .nav-home-link { background: none; border: none; color: var(--muted); font-size: 13px; font-family: inherit; cursor: pointer; padding: 8px 12px 8px 4px; text-align: left; margin-bottom: 16px; }
  .nav-home-link:hover { color: var(--ink); }
  .logo-mark { width: 20px; height: 20px; flex-shrink: 0; color: var(--accent); }
  .nav-item {
    display: flex; align-items: center; gap: 11px; text-align: left;
    background: none; border: none; padding: 10px 12px; border-radius: 9px;
    font-size: 14px; font-family: inherit; color: var(--muted); cursor: pointer;
  }
  .nav-item:hover { background: color-mix(in oklch, var(--line) 60%, transparent); }
  .nav-item.active { background: color-mix(in oklch, var(--accent) 13%, white); color: var(--ink); font-weight: 600; }
  .nav-item.done { color: var(--ink); }
  .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); flex-shrink: 0; }
  .nav-item.active .nav-dot, .nav-item.done .nav-dot { background: var(--accent); }

  .main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 56px 40px 64px; overflow-y: auto; max-height: 100vh; }
  .progress-track { width: 100%; max-width: 640px; height: 4px; background: var(--line); border-radius: 2px; margin-bottom: 44px; overflow: hidden; flex-shrink: 0; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; }

  .card { width: 100%; max-width: 640px; }
  .kicker {
    display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--accent); background: color-mix(in oklch, var(--accent) 12%, white); padding: 5px 12px; border-radius: 999px; margin-bottom: 20px;
  }
  .step-title { font-family: 'Newsreader', Georgia, serif; font-size: 34px; font-weight: 600; line-height: 1.2; margin: 0 0 12px; color: var(--ink); }
  .step-subtitle { font-size: 15.5px; color: var(--muted); line-height: 1.65; margin: 0 0 38px; max-width: 560px; }

  .field { margin-bottom: 28px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 9px; }
  .field input[type="text"], .field textarea {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px 14px;
    font-size: 15px; font-family: inherit; color: var(--ink); background: var(--surface);
  }
  .field textarea { min-height: 88px; resize: vertical; line-height: 1.55; }
  .field input::placeholder, .field textarea::placeholder { color: var(--placeholder); }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  .pill-group { display: flex; flex-wrap: wrap; gap: 9px; }
  .pill {
    border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 10px 17px;
    font-size: 14px; font-family: inherit; color: var(--ink); cursor: pointer;
  }
  .pill.selected { background: var(--accent); border-color: var(--accent); color: white; }

  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .tag { background: color-mix(in oklch, var(--accent) 15%, white); color: color-mix(in oklch, var(--accent) 55%, black); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; }

  .nav-buttons { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 640px; margin-top: 8px; flex-shrink: 0; }
  .nav-left, .nav-right { display: flex; gap: 12px; }
  .btn { border: none; border-radius: 10px; padding: 13px 24px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); }
  .btn-ghost { background: none; color: var(--muted); border: none; padding: 13px 6px; }

  .review-card { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 44px 44px 36px; }
  .review-section { margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .review-section:last-of-type { border-bottom: none; margin-bottom: 8px; padding-bottom: 0; }
  .review-heading { font-family: 'Newsreader', Georgia, serif; font-size: 17px; font-weight: 600; margin: 0 0 16px; color: var(--ink); }
  .review-row { display: flex; gap: 20px; margin-bottom: 12px; align-items: baseline; }
  .review-row:last-child { margin-bottom: 0; }
  .review-label { flex: 0 0 40%; font-size: 13px; color: var(--muted); }
  .review-value { flex: 1; font-size: 14.5px; color: var(--ink); line-height: 1.55; white-space: pre-line; }
  .empty-state { font-size: 14.5px; color: var(--muted); line-height: 1.6; margin: 0 0 28px; }
  .review-actions { display: flex; gap: 12px; margin-top: 8px; }

  .sample-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }

  .preview-backdrop { position: fixed; inset: 0; background: color-mix(in oklch, black 45%, transparent); display: flex; align-items: center; justify-content: center; padding: 40px; z-index: 50; }
  .preview-modal { background: var(--surface); border-radius: 16px; max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 36px 40px 32px; box-shadow: 0 24px 64px rgba(0,0,0,0.28); }
  .preview-modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 4px; }
  .preview-modal .close-btn { font-size: 14px; flex-shrink: 0; }

  .home { flex: 1 1 auto; min-width: 0; overflow-y: auto; max-height: 100vh; padding: 40px 48px 88px; display: flex; flex-direction: column; align-items: center; }
  .home-nav { width: 100%; max-width: 980px; display: flex; align-items: center; margin-bottom: 64px; }
  .home-brand { display: flex; align-items: center; gap: 10px; }
  .home-wordmark { font-family: 'Newsreader', Georgia, serif; font-size: 19px; font-weight: 600; color: var(--ink); }

  .hero { width: 100%; max-width: 720px; text-align: center; display: flex; flex-direction: column; align-items: center; margin-bottom: 92px; }
  .hero-title { font-family: 'Newsreader', Georgia, serif; font-size: 46px; font-weight: 600; line-height: 1.12; margin: 0 0 18px; color: var(--ink); }
  .hero-subtitle { font-size: 17px; color: var(--muted); line-height: 1.65; max-width: 560px; margin: 0 0 32px; }
  .hero-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 4px; }
  .hero-time-note { font-size: 13px; color: var(--muted); }
  .hero-visual { width: 100%; display: flex; justify-content: center; margin-top: 28px; }
  .hero-visual-svg { width: 100%; max-width: 420px; height: auto; }
  .ring { fill: none; stroke-width: 1.4; transform-box: fill-box; transform-origin: center; }
  .ring-a { animation: pulseA 3.4s ease-in-out infinite; }
  .ring-b { animation: pulseB 3.4s ease-in-out infinite; animation-delay: 0.3s; }
  .ring-c { animation: pulseC 3.4s ease-in-out infinite; animation-delay: 0.6s; }
  @keyframes pulseA { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.22; transform: scale(1.06); } }
  @keyframes pulseB { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.12; transform: scale(1.08); } }
  @keyframes pulseC { 0%, 100% { opacity: 0.18; transform: scale(1); } 50% { opacity: 0.04; transform: scale(1.1); } }

  .vision-section { width: 100%; max-width: 760px; text-align: center; margin-bottom: 92px; }
  .vision-statement { font-family: 'Newsreader', Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1.35; color: var(--ink); margin: 0 0 20px; }
  .vision-support { font-size: 15.5px; color: var(--muted); line-height: 1.7; max-width: 560px; margin: 0 auto; }

  .home-section { width: 100%; max-width: 900px; margin-bottom: 80px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .section-eyebrow { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
  .section-body { font-size: 15px; color: var(--muted); max-width: 520px; margin: -10px 0 32px; line-height: 1.6; }

  .benefits-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; width: 100%; }
  .benefit-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; text-align: left; }
  .benefit-icon { width: 28px; height: 28px; margin-bottom: 16px; color: var(--accent); }
  .benefit-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; }
  .benefit-card h3 { font-family: 'Newsreader', Georgia, serif; font-size: 18px; margin: 0 0 8px; color: var(--ink); }
  .benefit-card p { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0; }

  .how-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; width: 100%; }
  .how-step { text-align: left; }
  .how-number { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: color-mix(in oklch, var(--accent) 14%, white); color: var(--accent); font-weight: 600; font-size: 13px; margin-bottom: 14px; }
  .how-step h3 { font-family: 'Newsreader', Georgia, serif; font-size: 17px; margin: 0 0 8px; color: var(--ink); }
  .how-step p { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0; }

  .samples-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; width: 100%; max-width: 640px; }
  .sample-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; text-align: left; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .sample-card h3 { font-family: 'Newsreader', Georgia, serif; font-size: 17px; margin: 0; color: var(--ink); }
  .sample-card p { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 0 0 6px; }

  .home-footer { width: 100%; max-width: 640px; text-align: center; padding: 56px 0 24px; border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .footer-title { font-family: 'Newsreader', Georgia, serif; font-size: 26px; font-weight: 600; color: var(--ink); margin: 0; }

  @media (max-width: 760px) {
    .benefits-grid, .how-grid, .samples-row { grid-template-columns: 1fr; }
    .hero-title { font-size: 32px; }
    .vision-statement { font-size: 24px; }
    .home { padding: 32px 24px 64px; }
    .sidebar { display: none; }
  }

  .audio-widget { position: fixed; top: 20px; right: 20px; z-index: 60; }
  .audio-toggle {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--line);
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--accent); padding: 0;
  }
  .audio-toggle:hover { background: color-mix(in oklch, var(--accent) 10%, var(--surface)); }
  .audio-toggle svg { width: 18px; height: 18px; }

  @media print {
    .audio-widget { display: none !important; }
    .sidebar, .progress-track, .nav-buttons, .review-actions, .pill-group, .preview-backdrop { display: none !important; }
    .app { display: block !important; background: white !important; }
    .main { padding: 0 !important; max-height: none !important; overflow: visible !important; }
    .card, .review-card { max-width: 100% !important; border: none !important; padding: 0 !important; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="modal-root"></div>

<div class="audio-widget">
  <button type="button" id="audio-toggle" class="audio-toggle" aria-label="Play background music" onclick="AudioWidget.toggle()">
    <svg id="audio-icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
    <svg id="audio-icon-pause" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/></svg>
  </button>
</div>
<div id="yt-wrapper" style="position:fixed; left:-9999px; top:-9999px; width:2px; height:2px; overflow:hidden;">
  <div id="yt-player-container"></div>
</div>

<script>
(function () {
  'use strict';

  // ---------- content model (ported 1:1 from the design) ----------

  var STEPS = [
    {
      id: 'about', kind: 'form', title: 'About You',
      subtitle: 'The basics — who you are and what you bring.',
      fields: [
        { key: 'name', label: 'Your name', kind: 'text', placeholder: 'e.g. Jordan Lee' },
        { key: 'role', label: 'Role', kind: 'text', placeholder: 'e.g. Senior Product Designer' },
        { key: 'experience', label: 'Background', kind: 'text', placeholder: 'e.g. 8 years in product design, 3 leading a team' },
        { key: 'knownFor', label: 'What people can count on you for', kind: 'textarea', placeholder: 'e.g. Turning messy problems into clear plans, and following through.' },
        { key: 'careAbout', label: 'What you care about in your work', kind: 'textarea', placeholder: 'e.g. Craft, honest feedback, and making the team look good.' }
      ]
    },
    {
      id: 'communicate', kind: 'form', title: 'How You Communicate',
      subtitle: 'Knowing this up front saves everyone the guesswork.',
      fields: [
        { key: 'quickChannel', label: 'Best channel for quick things', kind: 'text', placeholder: 'e.g. Slack' },
        { key: 'complexChannel', label: 'Best channel for anything complex or sensitive', kind: 'text', placeholder: 'e.g. A scheduled call' },
        { key: 'responseTime', label: 'Response time people can expect', kind: 'text', placeholder: 'e.g. Within a few hours, longer on deep-focus days' },
        { key: 'directness', label: 'How you like things said', kind: 'segmented', options: ['Say it straight', 'Ease into it', 'Somewhere in between'] },
        { key: 'processingStyle', label: 'How you process best', kind: 'textarea', placeholder: 'e.g. I like a minute to think before answering something complex — writing helps me organize my thoughts.' }
      ]
    },
    {
      id: 'workstyle', kind: 'form', title: 'How You Work',
      subtitle: 'The conditions that bring out your best, and what gets in the way.',
      fields: [
        { key: 'decisionStyle', label: 'How you make decisions', kind: 'textarea', placeholder: 'e.g. I weigh the data, but I trust my gut when time is short.' },
        { key: 'bestFocusConditions', label: 'When you are at your best', kind: 'textarea', placeholder: 'e.g. Mornings, with a clear block of uninterrupted time.' },
        { key: 'focusBreakers', label: 'What throws off your focus', kind: 'textarea', placeholder: 'e.g. Back-to-back meetings with no breaks between them.' },
        { key: 'headsUp', label: 'A heads-up you appreciate', kind: 'textarea', placeholder: 'e.g. Send an agenda before you grab time with me.' }
      ]
    },
    {
      id: 'feedback', kind: 'form', title: 'Feedback & Support',
      subtitle: 'What helps feedback actually land, and what helps you do great work.',
      fields: [
        { key: 'feedbackReceive', label: 'How you like feedback delivered', kind: 'textarea', placeholder: 'e.g. Directly and early — I would rather hear it now than later.' },
        { key: 'feedbackGive', label: 'How you tend to give feedback', kind: 'textarea', placeholder: 'e.g. The same way — direct, but kind.' },
        { key: 'recognition', label: 'What recognition actually lands for you', kind: 'textarea', placeholder: 'e.g. Specific, concrete callouts beat general praise.' },
        { key: 'whatHelps', label: 'What helps you do your best work', kind: 'textarea', placeholder: 'e.g. Clear priorities, room to think, and trust to run with things.' }
      ]
    },
    {
      id: 'values', kind: 'form', title: 'Values & Expectations',
      subtitle: 'What matters to you, and what you hope for from the people around you.',
      fields: [
        { key: 'valueTeam', label: 'What you value in a team', kind: 'textarea', placeholder: 'e.g. Honesty, and a shared bar for quality.' },
        { key: 'valuePeople', label: 'What you value in the people you work with', kind: 'textarea', placeholder: 'e.g. Curiosity, and following through on commitments.' },
        { key: 'expectations', label: 'What you expect from teammates', kind: 'textarea', placeholder: 'e.g. Tell me early if something is off track.' }
      ]
    },
    {
      id: 'strengths', kind: 'form', title: 'Strengths & Growth',
      subtitle: 'A quick, honest picture, not a highlight reel.',
      fields: [
        { key: 'strengths', label: 'Your key strengths', kind: 'tags', placeholder: 'e.g. Meticulous, calm under pressure, a good listener (separate with commas)' },
        { key: 'growingIn', label: 'What you are actively working on', kind: 'textarea', placeholder: 'e.g. Speaking up sooner in big group settings.' }
      ]
    },
    {
      id: 'extras', kind: 'form', title: 'A Few More Things',
      subtitle: 'The small details that make working together smoother.',
      fields: [
        { key: 'frictionApproach', label: 'If there is friction, the best way to raise it with you', kind: 'textarea', placeholder: 'e.g. Tell me directly and early — I would rather know.' },
        { key: 'funFacts', label: 'Fun facts about you', kind: 'textarea', placeholder: 'e.g. I make a mean sourdough, and I once ran a marathon on a dare.' }
      ]
    },
    { id: 'review', kind: 'review' }
  ];

  var REVIEW_GROUPS = [
    { heading: 'About Me', rows: [
      { key: 'role', label: 'Role' },
      { key: 'experience', label: 'Background' },
      { key: 'knownFor', label: 'What people can count on me for' },
      { key: 'careAbout', label: 'What I care about' }
    ]},
    { heading: 'How I Communicate', rows: [
      { key: 'quickChannel', label: 'Best channel for quick things' },
      { key: 'complexChannel', label: 'Best channel for anything complex or sensitive' },
      { key: 'responseTime', label: 'Response time' },
      { key: 'directness', label: 'How I like things said' },
      { key: 'processingStyle', label: 'How I process best' }
    ]},
    { heading: 'How I Work', rows: [
      { key: 'decisionStyle', label: 'How I make decisions' },
      { key: 'bestFocusConditions', label: 'When I am at my best' },
      { key: 'focusBreakers', label: 'What throws off my focus' },
      { key: 'headsUp', label: 'A heads-up I appreciate' }
    ]},
    { heading: 'Feedback & Support', rows: [
      { key: 'feedbackReceive', label: 'How I like feedback delivered' },
      { key: 'feedbackGive', label: 'How I tend to give feedback' },
      { key: 'recognition', label: 'What recognition actually lands for me' },
      { key: 'whatHelps', label: 'What helps me do my best work' }
    ]},
    { heading: 'Values & Expectations', rows: [
      { key: 'valueTeam', label: 'What I value in a team' },
      { key: 'valuePeople', label: 'What I value in the people I work with' },
      { key: 'expectations', label: 'What I expect from teammates' }
    ]},
    { heading: 'Growth', rows: [
      { key: 'growingIn', label: 'What I am actively working on' }
    ]},
    { heading: 'A Few More Things', rows: [
      { key: 'frictionApproach', label: 'If there is friction, the best way to raise it with me' },
      { key: 'funFacts', label: 'Fun facts about me' }
    ]}
  ];

  var ONEPAGER_QUICKFACTS = [
    { key: 'quickChannel', label: 'Best via' },
    { key: 'responseTime', label: 'Reply time' },
    { key: 'directness', label: 'Style' }
  ];

  var ONEPAGER_ESSENTIALS = [
    { key: 'knownFor', label: 'Known for' },
    { key: 'whatHelps', label: "Do this and I'll thrive" },
    { key: 'feedbackReceive', label: 'Feedback that works' },
    { key: 'frictionApproach', label: "If something's off" }
  ];

  var SAMPLE_VALUES = {
    name: 'Amara Chen',
    role: 'Senior Backend Engineer, Payments Platform',
    experience: '9 years building distributed systems, 2 years mentoring junior engineers',
    knownFor: 'Turning vague requirements into a clear technical plan, and catching edge cases before they become incidents.',
    careAbout: "Reliability, clean interfaces between systems, and making sure on-call isn't miserable.",
    quickChannel: 'Slack',
    complexChannel: 'A 30-minute call, not a Slack thread',
    responseTime: 'Within a few hours during work hours',
    directness: 'Say it straight',
    processingStyle: "I think out loud in conversation, but I write better answers when I've had a night to sleep on something complex.",
    decisionStyle: "I look for data first, but I won't let analysis paralysis block a call that needs to be made this week.",
    bestFocusConditions: 'Early mornings, before the first meeting, headphones on.',
    focusBreakers: 'A calendar with no gaps between meetings.',
    headsUp: 'Send the doc before the meeting — I read faster than I listen.',
    feedbackReceive: 'Directly, and as close to the moment as possible.',
    feedbackGive: "Same — I'd rather say it now than let it become a pattern.",
    recognition: "A specific line about what worked means more to me than a general 'great job.'",
    whatHelps: 'Clear ownership boundaries, and space to go deep on one hard problem instead of ten shallow ones.',
    valueTeam: 'A team that argues about ideas, not people.',
    valuePeople: 'People who follow through without needing to be chased.',
    expectations: "Flag risk early, even if you're not sure yet it's a real problem.",
    strengths: 'Meticulous, calm under pressure, direct, a strong mentor, good at simplifying complexity',
    growingIn: 'Delegating the fun problems instead of keeping them for myself.',
    frictionApproach: "Tell me straight, sooner rather than later — I'd rather fix it than keep guessing.",
    funFacts: 'Rebuilds vintage synthesizers on weekends, and once debugged a production incident from a campsite with one bar of signal.'
  };

  function isFilled(s) { return !!(s && String(s).trim().length > 0); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function deriveTags(raw) {
    return (raw || '').split(',').map(function (t) { return t.trim(); }).filter(function (t) { return t.length > 0; }).map(function (t) { return { label: t }; });
  }

  function buildDetailedSections(values) {
    return REVIEW_GROUPS.map(function (g) {
      var items = g.rows.map(function (r) { return { label: r.label, value: values[r.key] }; }).filter(function (it) { return isFilled(it.value); });
      return { heading: g.heading, items: items };
    }).filter(function (g) { return g.items.length > 0; });
  }

  function buildOnePagerFacts(values) {
    return ONEPAGER_QUICKFACTS.map(function (r) { return { label: r.label, value: values[r.key] }; }).filter(function (it) { return isFilled(it.value); });
  }

  function buildOnePagerEssentials(values) {
    return ONEPAGER_ESSENTIALS.map(function (r) { return { label: r.label, value: values[r.key] }; }).filter(function (it) { return isFilled(it.value); });
  }

  function docTitleFor(values) {
    return isFilled(values.name) ? 'Working With ' + values.name.trim() : 'Working With Me';
  }

  // ---------- state ----------

  var state = { view: 'home', step: 0, values: {}, exportView: 'detailed', previewOpen: null };

  function update(mutate) {
    var active = document.activeElement;
    var activeId = active && active.id;
    var selStart = active && 'selectionStart' in active ? active.selectionStart : null;
    var selEnd = active && 'selectionEnd' in active ? active.selectionEnd : null;
    mutate();
    render();
    if (activeId) {
      var el = document.getElementById(activeId);
      if (el) {
        el.focus();
        if (selStart !== null && el.setSelectionRange) {
          try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
  }

  var App = {
    setField: function (key, val) { update(function () { state.values[key] = val; }); },
    goTo: function (i) { update(function () { state.step = Math.max(0, Math.min(STEPS.length - 1, i)); }); },
    back: function () { App.goTo(state.step - 1); },
    next: function () { App.goTo(state.step + 1); },
    reset: function () { update(function () { state.step = 0; state.values = {}; }); },
    setExportView: function (v) { update(function () { state.exportView = v; }); },
    enterWizard: function () { update(function () { state.view = 'wizard'; }); },
    goHome: function () { update(function () { state.view = 'home'; }); },
    openPreview: function (mode) { update(function () { state.previewOpen = mode; }); },
    closePreview: function () { update(function () { state.previewOpen = null; }); },
    print: function () { window.print(); }
  };

  // ---------- rendering ----------

  function reviewRow(item) {
    return '<div class="review-row"><div class="review-label">' + esc(item.label) + '</div><div class="review-value">' + esc(item.value) + '</div></div>';
  }

  function reviewSection(heading, rows) {
    return '<div class="review-section"><h3 class="review-heading">' + esc(heading) + '</h3>' + rows.map(reviewRow).join('') + '</div>';
  }

  function tagRow(tags) {
    return '<div class="review-section"><h3 class="review-heading">Strengths</h3><div class="tag-row">' +
      tags.map(function (t) { return '<span class="tag">' + esc(t.label) + '</span>'; }).join('') + '</div></div>';
  }

  function manualBody(values, mode) {
    var sections = buildDetailedSections(values);
    var quickFacts = buildOnePagerFacts(values);
    var essentials = buildOnePagerEssentials(values);
    var tags = deriveTags(values.strengths);
    var hasTags = tags.length > 0;
    var hasContent = mode === 'onepager'
      ? (quickFacts.length > 0 || essentials.length > 0 || hasTags)
      : (sections.length > 0 || hasTags);

    if (!hasContent) {
      return '<p class="empty-state">Nothing here yet — jump into any section on the left and add a few details to see your manual take shape.</p>';
    }
    var html = '';
    if (mode === 'onepager') {
      html += reviewSection('Quick facts', quickFacts);
      html += reviewSection('The essentials', essentials);
    } else {
      html += sections.map(function (s) { return reviewSection(s.heading, s.items); }).join('');
    }
    if (hasTags) html += tagRow(tags);
    return html;
  }

  function fieldHtml(f, values) {
    var raw = values[f.key] || '';
    var id = 'field-' + f.key;
    var out = '<div class="field"><label>' + esc(f.label) + '</label>';
    if (f.kind === 'text') {
      out += '<input type="text" id="' + id + '" value="' + esc(raw) + '" placeholder="' + esc(f.placeholder) + '" oninput="App.setField(\'' + f.key + '\', this.value)">';
    } else if (f.kind === 'textarea') {
      out += '<textarea id="' + id + '" placeholder="' + esc(f.placeholder) + '" oninput="App.setField(\'' + f.key + '\', this.value)">' + esc(raw) + '</textarea>';
    } else if (f.kind === 'tags') {
      var tags = deriveTags(raw);
      out += '<textarea id="' + id + '" placeholder="' + esc(f.placeholder) + '" oninput="App.setField(\'' + f.key + '\', this.value)">' + esc(raw) + '</textarea>';
      if (tags.length > 0) {
        out += '<div class="tag-row">' + tags.map(function (t) { return '<span class="tag">' + esc(t.label) + '</span>'; }).join('') + '</div>';
      }
    } else if (f.kind === 'segmented') {
      out += '<div class="pill-group">' + f.options.map(function (opt) {
        var selected = raw === opt;
        return '<button type="button" class="pill' + (selected ? ' selected' : '') + '" onclick="App.setField(\'' + f.key + '\', ' + JSON.stringify(opt) + ')">' + esc(opt) + '</button>';
      }).join('') + '</div>';
    }
    out += '</div>';
    return out;
  }

  function logoMarkSvg() {
    return '<svg class="logo-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M3 12c1.4-4.2 2.8-6.3 4.3-6.3s2.9 8.6 4.4 8.6 2.9-6.3 4.4-6.3 2.6 3.7 4.1 3.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function renderHome() {
    var hasStarted = state.step > 0 || Object.keys(state.values).some(function (k) { return isFilled(state.values[k]); });
    var ctaLabel = hasStarted ? 'Pick up where you left off' : 'Find your wavelength';

    return '' +
    '<div class="home">' +
      '<div class="home-nav"><div class="home-brand">' + logoMarkSvg() + '<span class="home-wordmark">Wavelength</span></div></div>' +
      '<section class="hero">' +
        '<span class="kicker">Because nobody comes with instructions</span>' +
        '<h1 class="hero-title">Get on the same wavelength, faster.</h1>' +
        '<p class="hero-subtitle">We\'re all a little different, and that\'s the whole point. A few honest answers turn into something people can actually use — how you think, what helps you thrive, what throws you off. Share it, and the guesswork just melts away.</p>' +
        '<div class="hero-actions">' +
          '<button type="button" class="btn btn-primary" onclick="App.enterWizard()">' + esc(ctaLabel) + '</button>' +
          '<span class="hero-time-note">Five minutes, no small talk required</span>' +
        '</div>' +
        '<div class="hero-visual"><svg class="hero-visual-svg" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
          '<circle cx="120" cy="110" r="10" style="fill: var(--accent);"/>' +
          '<circle cx="120" cy="110" r="34" class="ring ring-a" style="stroke: var(--accent);"/>' +
          '<circle cx="120" cy="110" r="58" class="ring ring-b" style="stroke: var(--accent);"/>' +
          '<circle cx="120" cy="110" r="82" class="ring ring-c" style="stroke: var(--accent);"/>' +
          '<circle cx="360" cy="110" r="10" fill="#8f887c"/>' +
          '<circle cx="360" cy="110" r="34" class="ring ring-a" stroke="#8f887c"/>' +
          '<circle cx="360" cy="110" r="58" class="ring ring-b" stroke="#8f887c"/>' +
          '<circle cx="360" cy="110" r="82" class="ring ring-c" stroke="#8f887c"/>' +
          '<circle cx="240" cy="110" r="4.5" style="fill: var(--accent);"/>' +
          '<circle cx="240" cy="82" r="3" style="fill: var(--accent);" opacity="0.6"/>' +
          '<circle cx="240" cy="138" r="3" style="fill: var(--accent);" opacity="0.6"/>' +
        '</svg></div>' +
      '</section>' +

      '<section class="vision-section">' +
        '<span class="section-eyebrow">Why this, why now</span>' +
        '<p class="vision-statement">AI can write your emails. It can\'t make you <span style="color: var(--accent);">understood</span>.</p>' +
        '<p class="vision-support">The more we lean on machines to talk for us, the easier it is to forget how to talk to each other. Wavelength is a small, human counter-move — a few honest words, in your own voice, so the people around you don\'t need an algorithm to know how to work with you.</p>' +
      '</section>' +

      '<section class="home-section">' +
        '<span class="section-eyebrow">The stuff nobody says out loud</span>' +
        '<div class="benefits-grid">' +
          '<div class="benefit-card"><div class="benefit-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="1.6"/><path d="M8 12.3l2.6 2.6L16 9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h3>Less friction</h3><p>No more re-explaining yourself to every new teammate like it\'s your first day, forever.</p></div>' +
          '<div class="benefit-card"><div class="benefit-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="6.5" stroke-width="1.6"/><circle cx="15" cy="12" r="6.5" stroke-width="1.6"/></svg></div><h3>Faster trust</h3><p>New teammates (and new managers) actually get you in minutes, not months.</p></div>' +
          '<div class="benefit-card"><div class="benefit-icon"><svg viewBox="0 0 24 24"><path d="M5.5 15.5a9 9 0 0 1 13 0" stroke-width="1.6" stroke-linecap="round"/><path d="M8.3 18a5 5 0 0 1 7.4 0" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="20" r="1.1" stroke="none" fill="currentColor"/></svg></div><h3>Fewer crossed wires</h3><p>The quiet little misreads that build into real friction? Gone before they start.</p></div>' +
        '</div>' +
      '</section>' +

      '<section class="home-section">' +
        '<span class="section-eyebrow">How it works</span>' +
        '<div class="how-grid">' +
          '<div class="how-step"><span class="how-number">1</span><h3>Answer like you mean it</h3><p>Seven short sections. No wrong answers — just the true ones.</p></div>' +
          '<div class="how-step"><span class="how-number">2</span><h3>Watch yourself take shape</h3><p>It comes together right in front of you — the quick version and the whole story, side by side.</p></div>' +
          '<div class="how-step"><span class="how-number">3</span><h3>Let it do the talking</h3><p>Drop it in a doc, print it, or just send the link — however it lands, it starts working for you.</p></div>' +
        '</div>' +
      '</section>' +

      '<section class="home-section">' +
        '<span class="section-eyebrow">Not sure what to say yet?</span>' +
        '<p class="section-body">That\'s normal — most people freeze up on a blank page. Here\'s what it looks like once someone else has already opened up.</p>' +
        '<div class="samples-row">' +
          '<div class="sample-card"><h3>One-pager</h3><p>The quick read — the handful of things someone should know before they even say hello.</p><button type="button" class="btn btn-secondary" onclick="App.openPreview(\'onepager\')">Preview the one-pager</button></div>' +
          '<div class="sample-card"><h3>Detailed version</h3><p>The whole story — for the new manager, the closest collaborators, or anyone who wants to really get you.</p><button type="button" class="btn btn-secondary" onclick="App.openPreview(\'detailed\')">Preview the detailed version</button></div>' +
        '</div>' +
      '</section>' +

      '<section class="home-footer">' +
        '<h2 class="footer-title">Your people are waiting to actually get you.</h2>' +
        '<button type="button" class="btn btn-primary" onclick="App.enterWizard()">' + esc(ctaLabel) + '</button>' +
      '</section>' +
    '</div>';
  }

  function renderWizard() {
    var stepIndex = state.step;
    var step = STEPS[stepIndex];
    var total = STEPS.length;
    var formStepCount = total - 1;
    var isReview = step.kind === 'review';
    var isForm = step.kind === 'form';
    var progressPct = isReview ? 100 : Math.round((stepIndex / formStepCount) * 100);
    var lastFormIndex = formStepCount - 1;
    var nextLabel = stepIndex === lastFormIndex ? 'Review my manual' : 'Next';

    var sidebarItems = STEPS.map(function (s, i) {
      var label = s.kind === 'review' ? 'Your Manual' : s.title;
      var cls = 'nav-item' + (i === stepIndex ? ' active' : '') + (i < stepIndex ? ' done' : '');
      return '<button type="button" class="' + cls + '" onclick="App.goTo(' + i + ')"><span class="nav-dot"></span>' + esc(label) + '</button>';
    }).join('');

    var body = '';
    if (isForm) {
      body = '<div class="card"><h1 class="step-title">' + esc(step.title) + '</h1><p class="step-subtitle">' + esc(step.subtitle) + '</p>' +
        step.fields.map(function (f) { return fieldHtml(f, state.values); }).join('') + '</div>';
    } else {
      var docTitle = docTitleFor(state.values);
      var mode = state.exportView || 'detailed';
      body = '<div class="card review-card"><h1 class="step-title">' + esc(docTitle) + '</h1>' +
        '<p class="step-subtitle">Copy this into a doc, share this page, or use your browser\'s print dialog to save it as a PDF.</p>' +
        '<div class="pill-group" style="margin-bottom: 30px;">' +
          '<button type="button" class="pill' + (mode === 'detailed' ? ' selected' : '') + '" onclick="App.setExportView(\'detailed\')">Detailed</button>' +
          '<button type="button" class="pill' + (mode === 'onepager' ? ' selected' : '') + '" onclick="App.setExportView(\'onepager\')">One-pager</button>' +
        '</div>' +
        manualBody(state.values, mode) +
        '<div class="review-actions">' +
          '<button type="button" class="btn btn-secondary" onclick="App.print()">Print / Save as PDF</button>' +
          '<button type="button" class="btn btn-ghost" onclick="App.reset()">Start over</button>' +
        '</div></div>';
    }

    var nav = '';
    if (!isReview) {
      nav = '<div class="nav-buttons"><div class="nav-left">' +
        (stepIndex > 0 ? '<button type="button" class="btn btn-secondary" onclick="App.back()">Back</button>' : '') +
        '</div><div class="nav-right"><button type="button" class="btn btn-primary" onclick="App.next()">' + esc(nextLabel) + '</button></div></div>';
    }

    return '' +
      '<aside class="sidebar">' +
        '<p class="sidebar-brand">' + logoMarkSvg() + 'Wavelength</p>' +
        '<p class="sidebar-tagline">A few honest details, so the people you work with don\'t have to guess.</p>' +
        '<button type="button" class="nav-home-link" onclick="App.goHome()">← Back to home</button>' +
        sidebarItems +
      '</aside>' +
      '<main class="main">' +
        '<div class="progress-track"><div class="progress-fill" style="width: ' + progressPct + '%"></div></div>' +
        body + nav +
      '</main>';
  }

  function renderModal() {
    var mode = state.previewOpen;
    if (!mode) return '';
    var label = mode === 'onepager' ? 'A sample: the quick read' : 'A sample: the whole story';
    var title = docTitleFor(SAMPLE_VALUES);
    return '' +
      '<div class="preview-backdrop" onclick="App.closePreview()">' +
        '<div class="preview-modal" onclick="event.stopPropagation()">' +
          '<div class="preview-modal-head"><span class="kicker">' + esc(label) + '</span>' +
          '<button type="button" class="btn btn-ghost close-btn" onclick="App.closePreview()">Close</button></div>' +
          '<h2 class="step-title" style="font-size: 26px;">' + esc(title) + '</h2>' +
          '<p class="step-subtitle" style="margin-bottom: 24px;">Just a glimpse of what\'s possible — your own words will live here soon enough.</p>' +
          manualBody(SAMPLE_VALUES, mode) +
        '</div>' +
      '</div>';
  }

  function render() {
    document.getElementById('app').innerHTML = state.view === 'home' ? renderHome() : renderWizard();
    document.getElementById('modal-root').innerHTML = renderModal();
  }

  window.App = App;
  render();
})();
</script>

<script>
  // Background audio widget — plays the linked track via YouTube's embed
  // player. Browsers block unmuted autoplay on a visitor's first load of a
  // site (a platform-level policy, not something a page can override), so
  // this attempts autoplay and falls back gracefully to a single click —
  // the icon always reflects what's actually playing.
  var AudioWidget = {
    player: null,
    playing: false,
    toggle: function () {
      if (!AudioWidget.player) return;
      if (AudioWidget.playing) { AudioWidget.player.pauseVideo(); }
      else { AudioWidget.player.playVideo(); }
    },
    onReady: function () {
      AudioWidget.player.playVideo();
    },
    onStateChange: function (event) {
      var isPlaying = event.data === 1; // YT.PlayerState.PLAYING
      AudioWidget.playing = isPlaying;
      document.getElementById('audio-icon-play').style.display = isPlaying ? 'none' : 'block';
      document.getElementById('audio-icon-pause').style.display = isPlaying ? 'block' : 'none';
    }
  };

  function onYouTubeIframeAPIReady() {
    AudioWidget.player = new YT.Player('yt-player-container', {
      height: '2',
      width: '2',
      videoId: '7jfMnh9c_d4',
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0, playsinline: 1 },
      events: {
        onReady: AudioWidget.onReady,
        onStateChange: AudioWidget.onStateChange
      }
    });
  }
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
